name: Prepare Deltarune Sprite Art

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/fetch_deltarune_sprites.py"
      - "DeltaruneActs/Cards/DeltaruneActsCard.cs"
      - ".github/workflows/fetch-deltarune-sprites.yml"

permissions:
  contents: write

jobs:
  sprites:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil

      - name: Generate one real sprite asset per card
        run: python3 tools/fetch_deltarune_sprites.py

      - name: Verify one individual normal and big portrait per card
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("DeltaruneActs/images/card_portraits")
          cards_dir = Path("DeltaruneActs/Cards")
          manifest_path = root / "SPRITE_SOURCES.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          cards = manifest.get("cards", {})

          expected = {
              p.stem.lower()
              for p in cards_dir.glob("*.cs")
              if p.stem != "DeltaruneActsCard"
          }
          actual = set(cards)
          if actual != expected:
              raise SystemExit(
                  f"Card coverage mismatch. Missing={sorted(expected - actual)} "
                  f"Extra={sorted(actual - expected)}"
              )

          normal = [item["asset"] for item in cards.values()]
          big = [item["big_asset"] for item in cards.values()]
          if len(normal) != len(set(normal)):
              raise SystemExit("Two cards share the same normal portrait asset")
          if len(big) != len(set(big)):
              raise SystemExit("Two cards share the same big portrait asset")

          missing = []
          for card, item in cards.items():
              for rel in (item["asset"], item["big_asset"]):
                  if not (root / rel).is_file():
                      missing.append(f"{card}: {rel}")
          if missing:
              raise SystemExit("Missing generated portraits:\n" + "\n".join(missing))

          for card, item in cards.items():
              if not item.get("source_sprite") or not item.get("source_url"):
                  raise SystemExit(f"No verified source metadata for {card}")

          print(f"Verified {len(cards)} cards with {len(normal)} unique normal portraits and {len(big)} unique big portraits.")
          PY

      - name: Commit generated sprite portraits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DeltaruneActs/images/card_portraits/*.png DeltaruneActs/images/card_portraits/big/*.png DeltaruneActs/images/card_portraits/SPRITE_SOURCES.json
          if git diff --cached --quiet; then
            echo "Sprite portraits are already up to date."
            exit 0
          fi
          git commit -m "Prepare individual Deltarune sprite card art"
          git push
